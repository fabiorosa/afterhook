services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afterhook
      POSTGRES_PASSWORD: afterhook
      POSTGRES_USER: afterhook
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterhook -d afterhook"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "54329:5432"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "56379:6379"
