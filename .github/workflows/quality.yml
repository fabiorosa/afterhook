name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: afterhook
          POSTGRES_PASSWORD: afterhook
          POSTGRES_USER: afterhook
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U afterhook -d afterhook"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run quality gates
        run: npm run quality
        env:
          DATABASE_URL: postgres://afterhook:afterhook@127.0.0.1:54329/afterhook
          TEST_DATABASE_URL: postgres://afterhook:afterhook@127.0.0.1:54329/afterhook
